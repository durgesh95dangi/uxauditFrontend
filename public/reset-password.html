<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set new password | UXAuditX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/tailwind.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <div class="bg-grid"></div>
    <header class="nav">
      <a class="brand" href="/">UXAuditX</a>
      <nav>
        <a href="/">Home</a>
        <a href="/login.html">Login</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-shell card">
        <h1>Set a new password</h1>
        <p class="subtitle">Choose a new password for your UXAuditX account.</p>
        <form id="reset-form" class="contact-form auth-form">
          <label>
            New password
            <input
              id="reset-password"
              type="password"
              placeholder="At least 6 characters"
              minlength="6"
              required
            />
          </label>
          <label>
            Confirm password
            <input
              id="reset-confirm"
              type="password"
              placeholder="Repeat the password"
              minlength="6"
              required
            />
          </label>
          <button type="submit" class="btn btn-primary">Update password</button>
        </form>
        <p class="auth-helper">
          <a href="/login.html">Back to login</a>
        </p>
        <p id="reset-result" class="auth-result">Verifying reset link...</p>
      </section>
    </main>

    <script>
      const AUTH_API_BASE = window.location.origin;
      const LOGIN_PATH = "/login";

      function setResult(message, isError = false) {
        const el = document.getElementById("reset-result");
        el.textContent = message;
        el.classList.toggle("error", isError);
        el.classList.toggle("success", !isError);
      }

      function parseHashParams() {
        const hash = window.location.hash.startsWith("#")
          ? window.location.hash.slice(1)
          : window.location.hash;
        const params = new URLSearchParams(hash);
        return {
          accessToken: params.get("access_token"),
          type: params.get("type"),
          errorDescription: params.get("error_description")
        };
      }

      const { accessToken, type, errorDescription } = parseHashParams();
      const form = document.getElementById("reset-form");
      const submitBtn = form.querySelector("button[type='submit']");

      if (errorDescription) {
        setResult(decodeURIComponent(errorDescription.replace(/\+/g, " ")), true);
        submitBtn.disabled = true;
      } else if (!accessToken || type !== "recovery") {
        setResult(
          "This page must be opened from the password reset email link.",
          true
        );
        submitBtn.disabled = true;
      } else {
        setResult("Enter a new password to finish resetting your account.");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById("reset-password").value;
        const confirmPassword = document.getElementById("reset-confirm").value;

        if (newPassword !== confirmPassword) {
          setResult("Passwords do not match.", true);
          return;
        }

        try {
          const response = await fetch(`${AUTH_API_BASE}/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ accessToken, newPassword })
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not update password");
          }

          setResult("Password updated. Redirecting to login...");
          setTimeout(() => {
            window.location.href = LOGIN_PATH;
          }, 1500);
        } catch (error) {
          setResult(error.message, true);
        }
      });
    </script>
  </body>
</html>
