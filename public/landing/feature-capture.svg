<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" fill="none">
  <rect width="640" height="420" rx="12" fill="#0c0c0c"/>
  <rect x="1" y="1" width="638" height="418" rx="11" stroke="rgba(255,255,255,0.08)"/>
  <rect x="0" y="0" width="640" height="36" fill="#141414"/>
  <circle cx="18" cy="18" r="5" fill="#f87171"/>
  <circle cx="34" cy="18" r="5" fill="#fbbf24"/>
  <circle cx="50" cy="18" r="5" fill="#34d399"/>
