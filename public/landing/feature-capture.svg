  <rect x="24" y="340" width="592" height="60" rx="6" fill="#141414" stroke="rgba(255,255,255,0.06)"/>
  <rect x="40" y="362" width="100" height="6" rx="2" fill="#404040"/>
  <rect x="40" y="378" width="72" height="6" rx="2" fill="#333"/>
  <text x="470" y="374" fill="#6366f1" font-family="ui-monospace, monospace" font-size="9">4 sections captured</text>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="640" y2="0">
      <stop stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamGlow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
