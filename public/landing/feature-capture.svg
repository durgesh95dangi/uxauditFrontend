  <rect x="312" y="200" width="120" height="52" rx="6" fill="#181818" stroke="rgba(255,255,255,0.08)"/>
  <rect x="448" y="200" width="120" height="52" rx="6" fill="#181818" stroke="rgba(255,255,255,0.08)"/>
  <rect x="24" y="214" width="592" height="2" fill="url(#beam)" opacity="0.9"/>
  <rect x="24" y="210" width="592" height="10" fill="url(#beamGlow)" opacity="0.35"/>
  <!-- social proof -->
  <rect x="24" y="268" width="592" height="56" rx="6" fill="#141414" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <rect x="40" y="288" width="80" height="8" rx="2" fill="#525252"/>
  <rect x="140" y="292" width="64" height="16" rx="4" fill="#181818"/>
  <rect x="220" y="292" width="64" height="16" rx="4" fill="#181818"/>
  <rect x="300" y="292" width="64" height="16" rx="4" fill="#181818"/>
