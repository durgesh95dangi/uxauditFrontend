<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup | UXAuditX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/tailwind.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <div class="bg-grid"></div>
    <header class="nav">
      <a class="brand" href="/">UXAuditX</a>
      <nav>
        <a href="/">Home</a>
        <a href="/login.html">Login</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-shell card">
        <h1>Create your account</h1>
        <p class="subtitle">Sign up to start running UX audits.</p>
        <form id="signup-form" class="contact-form auth-form">
          <label>
            Email
            <input id="signup-email" type="email" placeholder="you@company.com" required />
          </label>
          <label>
            Password
            <input id="signup-password" type="password" placeholder="Minimum 6 characters" required />
          </label>
          <button type="submit" class="btn btn-primary">Create account</button>
        </form>
        <p id="signup-result" class="auth-result">No signup request yet.</p>
      </section>
    </main>

    <script>
      const AUTH_API_BASE = window.location.origin;
      const DASHBOARD_PATH = "/dashboard";
      async function redirectIfAuthenticated() {
        const token = localStorage.getItem("uxauditx_access_token");
        if (!token) return;

        try {
          const response = await fetch(`${AUTH_API_BASE}/me`, {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (!response.ok) {
            localStorage.removeItem("uxauditx_access_token");
            return;
          }

          const result = await response.json();
          if (result.user) {
            window.location.href = DASHBOARD_PATH;
          }
        } catch {
          // Stay on signup page when auth API is unavailable.
        }
      }

      redirectIfAuthenticated();

      function setResult(message, isError = false) {
        const el = document.getElementById("signup-result");
        el.textContent = message;
        el.classList.toggle("error", isError);
        el.classList.toggle("success", !isError);
      }

      document.getElementById("signup-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("signup-email").value.trim();
        const password = document.getElementById("signup-password").value;

        try {
          const response = await fetch(`${AUTH_API_BASE}/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Signup failed");
          }

          if (result.session?.access_token) {
            localStorage.setItem("uxauditx_access_token", result.session.access_token);
            window.location.href = DASHBOARD_PATH;
            return;
          }

          setResult("Signup successful. Please verify your email, then log in.");
        } catch (error) {
          setResult(error.message, true);
        }
      });
    </script>
  </body>
</html>
