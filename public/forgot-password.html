<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password | UXAuditX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/tailwind.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page">
    <div class="bg-grid"></div>
    <header class="nav">
      <a class="brand" href="/">UXAuditX</a>
      <nav>
        <a href="/">Home</a>
        <a href="/login.html">Login</a>
      </nav>
    </header>

    <main class="auth-main">
      <section class="auth-shell card">
        <h1>Reset your password</h1>
        <p class="subtitle">Enter your account email and we'll send you a reset link.</p>
        <form id="forgot-form" class="contact-form auth-form">
          <label>
            Email
            <input id="forgot-email" type="email" placeholder="you@company.com" required />
          </label>
          <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>
        <p class="auth-helper">
          <a href="/login.html">Back to login</a>
        </p>
        <p id="forgot-result" class="auth-result">Enter your email to begin.</p>
      </section>
    </main>

    <script>
      const AUTH_API_BASE = "http://localhost:4000";
      const RESET_REDIRECT = `${window.location.origin}/reset-password.html`;

      function setResult(message, isError = false) {
        const el = document.getElementById("forgot-result");
        el.textContent = message;
        el.classList.toggle("error", isError);
        el.classList.toggle("success", !isError);
      }

      document.getElementById("forgot-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("forgot-email").value.trim();

        try {
          const response = await fetch(`${AUTH_API_BASE}/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, redirectTo: RESET_REDIRECT })
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Could not send reset email");
          }

          setResult(
            result.message ||
              "If an account exists for that email, a reset link has been sent."
          );
        } catch (error) {
          setResult(error.message, true);
        }
      });
    </script>
  </body>
</html>
